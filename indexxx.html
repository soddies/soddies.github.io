<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <div class="chat-container">
        <h1>Чат</h1>
        <div class="message-container">
            <div class="messages" id="messages">
            </div>
        </div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Введите сообщение">
            <input type="text" id="senderInput" placeholder="Введите отправителя">
            <button id="sendButton">Отправить сообщение</button>
        </div>
        <h2>Ваши сообщения:</h2>
        <div class="user-messages" id="userMessages">
            <!-- Сообщения пользователя будут отображаться здесь -->
        </div>
    </div>

    <div class="fixed-message">Чат сделан Пчелкиной Екатериной (soddies)</div>
    <script src="scripttt.js"></script>
</body>
</html>
